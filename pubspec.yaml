name: gopro_plugin
description: "Flutter plugin for GoPro camera control via BLE and Wi-Fi"
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  http: ^1.6.0
  path_provider: ^2.1.6
  permission_handler: 11.3.1
  video_player: ^2.11.1
  wifi_iot: ^0.3.19+3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aiunika.gopro_plugin
        pluginClass: GoProPlugin
      ios:
        pluginClass: GoProPlugin
